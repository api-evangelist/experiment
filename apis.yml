aid: experiment
name: Experiment
description: Experiment is an online crowdfunding platform for scientific research that connects
  scientists directly with backers who fund individual studies. Researchers across biology, chemistry,
  medicine, physics, computer science, paleontology, economics, engineering, and neuroscience post
  projects with goals and budgets; the public pledges funds, follows lab notes, and shares in the
  discoveries. Experiment (formerly Microryza) also supports university institutions and dedicated
  funding programs, and publishes results and updates back to funders. It was surfaced as a portfolio
  company of a16z, slow-ventures, and y-combinator and added to the API Evangelist network; enrichment
  found a live consumer website but no public developer API, docs, or well-known surface.
